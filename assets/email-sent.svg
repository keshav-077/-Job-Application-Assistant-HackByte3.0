<svg width="500" height="140" viewBox="0 0 500 140" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="planeGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <rect width="500" height="140" rx="14" fill="#0B1220"/>

  <!-- envelope (sender) -->
  <g transform="translate(40,55)">
    <rect x="0" y="0" width="54" height="38" rx="4" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M2 3 L27 22 L52 3" fill="none" stroke="#64748b" stroke-width="2"/>
  </g>

  <!-- dashed flight path -->
  <path id="flight" d="M 100 74 Q 250 20 400 74" stroke="#1e293b" stroke-width="2" stroke-dasharray="5 6" fill="none"/>

  <!-- paper plane traveling the path -->
  <g>
    <path d="M -9 -5 L 9 0 L -9 5 L -4 0 Z" fill="url(#planeGrad)">
      <animateMotion dur="3.2s" repeatCount="indefinite" rotate="auto" path="M 100 74 Q 250 20 400 74"/>
    </path>
  </g>

  <!-- inbox (recruiter) -->
  <g transform="translate(390,50)">
    <rect x="0" y="0" width="60" height="44" rx="5" fill="#1e293b" stroke="#334155" stroke-width="2"/>
    <path d="M2 4 L30 26 L58 4" fill="none" stroke="#64748b" stroke-width="2"/>
    <circle cx="52" cy="4" r="9" fill="#22C55E">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.92;0.98;1" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <path d="M48 4 L51 7 L57 1" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.85;0.92;0.98;1" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <text x="250" y="118" text-anchor="middle" fill="#475569" font-family="Verdana, Arial, sans-serif" font-size="11">
    personalized cold email → sent → delivered
  </text>
</svg>
