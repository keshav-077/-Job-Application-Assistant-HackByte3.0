<svg width="380" height="380" viewBox="0 0 380 380" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="hubGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <circle cx="190" cy="190" r="150" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>
  <circle cx="190" cy="190" r="105" fill="none" stroke="#1e293b" stroke-width="1" stroke-dasharray="4 6"/>

  <!-- outer ring: 3 nodes, orbit + counter-spin so labels stay upright -->
  <g transform="translate(190,40)">
    <circle r="26" fill="#0B1220" stroke="#0EA5E9" stroke-width="2"/>
    <text text-anchor="middle" dy="5" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#38bdf8">React</text>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 190 190;-360 190 190" dur="18s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(319,270)">
    <circle r="26" fill="#0B1220" stroke="#EA4B71" stroke-width="2"/>
    <text text-anchor="middle" dy="5" font-family="Verdana, Arial, sans-serif" font-size="11" fill="#fb7185">n8n</text>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 190 190;-360 190 190" dur="18s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(61,270)">
    <circle r="26" fill="#0B1220" stroke="#8B5CF6" stroke-width="2"/>
    <text text-anchor="middle" dy="5" font-family="Verdana, Arial, sans-serif" font-size="10" fill="#a78bfa">GPT-4o</text>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 190 190;-360 190 190" dur="18s" repeatCount="indefinite"/>
  </g>

  <!-- inner ring: 2 nodes, opposite direction -->
  <g transform="translate(295,190)">
    <circle r="22" fill="#0B1220" stroke="#22C55E" stroke-width="2"/>
    <text text-anchor="middle" dy="4" font-family="Verdana, Arial, sans-serif" font-size="9" fill="#4ade80">Sheets</text>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 190 190;360 190 190" dur="12s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(85,190)">
    <circle r="22" fill="#0B1220" stroke="#f59e0b" stroke-width="2"/>
    <text text-anchor="middle" dy="4" font-family="Verdana, Arial, sans-serif" font-size="9" fill="#fbbf24">Hunter</text>
    <animateTransform attributeName="transform" type="rotate" additive="sum" values="0 190 190;360 190 190" dur="12s" repeatCount="indefinite"/>
  </g>

  <!-- hub drawn last so it sits above connecting spokes -->
  <circle cx="190" cy="190" r="46" fill="url(#hubGrad)"/>
  <text x="190" y="185" text-anchor="middle" fill="#fff" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold">Vibe</text>
  <text x="190" y="201" text-anchor="middle" fill="#fff" font-family="Verdana, Arial, sans-serif" font-size="13" font-weight="bold">Apply</text>
</svg>
