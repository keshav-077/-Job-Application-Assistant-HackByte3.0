<svg width="640" height="80" viewBox="0 0 640 80" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B1220"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
  </defs>
  <rect width="640" height="80" rx="14" fill="url(#bg)" stroke="#1e293b" stroke-width="1.5"/>
  <circle cx="24" cy="20" r="5" fill="#ef4444"/>
  <circle cx="42" cy="20" r="5" fill="#eab308"/>
  <circle cx="60" cy="20" r="5" fill="#22c55e"/>

  <g font-family="Consolas, 'Courier New', monospace" font-size="19" fill="#38bdf8">
    <text x="30" y="55">
      <tspan>&gt; "Data Analyst in Bangalore"</tspan>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.0444;0.2889;0.3333;0.9889;1"
        values="0;1;1;0;0;0"/>
    </text>
    <text x="30" y="55">
      <tspan>&gt; "Backend Developer in Berlin"</tspan>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.3333;0.3778;0.6222;0.6667;1"
        values="0;0;1;1;0;0"/>
    </text>
    <text x="30" y="55">
      <tspan>&gt; "Marketing Manager, Remote"</tspan>
      <animate attributeName="opacity" dur="9s" repeatCount="indefinite"
        keyTimes="0;0.6667;0.7111;0.9556;1"
        values="0;0;1;1;0"/>
    </text>
  </g>

  <rect x="600" y="38" width="9" height="20" fill="#38bdf8" rx="1">
    <animate attributeName="opacity" values="1;0;1" dur="0.9s" repeatCount="indefinite"/>
  </rect>
</svg>
