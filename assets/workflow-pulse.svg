<svg width="920" height="170" viewBox="0 0 920 170" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="dotGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0EA5E9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="920" height="170" rx="16" fill="#0B1220"/>

  <path id="track" d="M 60 75 L 860 75" stroke="#1e293b" stroke-width="3" fill="none"/>

  <!-- traveling dot -->
  <circle r="7" fill="url(#dotGrad)" filter="url(#glow)">
    <animateMotion dur="6s" repeatCount="indefinite" path="M 60 75 L 860 75"/>
  </circle>

  <!-- nodes -->
  <g font-family="Verdana, Arial, sans-serif" font-size="12" text-anchor="middle">
    <!-- node 1 -->
    <circle cx="60" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#0EA5E9;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="60" y="80" fill="#e2e8f0" font-weight="bold">🎙</text>
    <text x="60" y="118" fill="#94a3b8">Input</text>

    <!-- node 2 -->
    <circle cx="220" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#0EA5E9;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="220" y="80" fill="#e2e8f0" font-weight="bold">🧠</text>
    <text x="220" y="118" fill="#94a3b8">AI Parse</text>

    <!-- node 3 -->
    <circle cx="380" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#0EA5E9;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <text x="380" y="80" fill="#e2e8f0" font-weight="bold">🕷</text>
    <text x="380" y="118" fill="#94a3b8">Scrape</text>

    <!-- node 4 -->
    <circle cx="540" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#8B5CF6;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="3s" repeatCount="indefinite"/>
    </circle>
    <text x="540" y="80" fill="#e2e8f0" font-weight="bold">🕵</text>
    <text x="540" y="118" fill="#94a3b8">Recruiter</text>

    <!-- node 5 -->
    <circle cx="700" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#8B5CF6;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="4s" repeatCount="indefinite"/>
    </circle>
    <text x="700" y="80" fill="#e2e8f0" font-weight="bold">📧</text>
    <text x="700" y="118" fill="#94a3b8">Email</text>

    <!-- node 6 -->
    <circle cx="860" cy="75" r="24" fill="#1e293b" stroke="#334155" stroke-width="2">
      <animate attributeName="fill" values="#1e293b;#22C55E;#1e293b;#1e293b;#1e293b;#1e293b" dur="6s" begin="5s" repeatCount="indefinite"/>
    </circle>
    <text x="860" y="80" fill="#e2e8f0" font-weight="bold">✅</text>
    <text x="860" y="118" fill="#94a3b8">Sheet</text>
  </g>

  <text x="460" y="150" text-anchor="middle" fill="#475569" font-family="Verdana, Arial, sans-serif" font-size="11">
    one query → parsed → scraped → contacted → logged
  </text>
</svg>
